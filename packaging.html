    .slideshow {

      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      background: #080808;
      border-bottom: 1px solid #222222;
    }

    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .slide.active {
      opacity: 1;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }


    /* SLIDESHOW BUTTONS */

    .slide-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);

      width: 45px;
      height: 45px;

      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.35);

      color: #ffffff;
      font-size: 24px;

      cursor: pointer;
      z-index: 5;

      transition: 0.3s;
    }

    .slide-button:hover {
      background: rgba(255,255,255,0.15);
    }

    .prev {
      left: 25px;
    }

    .next {
      right: 25px;
    }


    /* SLIDESHOW DOTS */

    .dots {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      gap: 8px;

      z-index: 5;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: rgba(255,255,255,0.4);

      cursor: pointer;

      transition: 0.3s;
    }

    .dot.active {
      background: #ffffff;
    }


    /* =========================
       GALLERY
    ========================= */

    .gallery-section {
      padding: 90px 7%;
    }

    .gallery-title {
      text-align: center;

      color: #666666;

      font-size: 11px;

      letter-spacing: 4px;

      text-transform: uppercase;

      margin-bottom: 45px;
    }

    .gallery {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 18px;

      max-width: 1500px;

      margin: 0 auto;
    }

    .project {
      aspect-ratio: 1 / 1;

      background: #0d0d0d;

      border: 1px solid #252525;

      overflow: hidden;

      cursor: pointer;

      transition: 0.4s ease;
    }

    .project:hover {
      border-color: #666666;

      transform: translateY(-4px);
    }

    .project img {
      width: 100%;
      height: 100%;

      object-fit: cover;

      display: block;

      transition: transform 0.5s ease;
    }

    .project:hover img {
      transform: scale(1.04);
    }


    /* =========================
       LIGHTBOX
    ========================= */

    .lightbox {
      position: fixed;

      inset: 0;

      background: rgba(0,0,0,0.94);

      display: none;

      align-items: center;

      justify-content: center;

      z-index: 100;

      padding: 30px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {

    }

    .close {

  <script>

    let currentSlide = 0;

    const slides =
      document.querySelectorAll(".slide");

    const dots =
      document.querySelectorAll(".dot");


    function showSlide(index) {

      currentSlide = index;

      slides.forEach((slide, i) => {

        slide.classList.toggle(
          "active",
          i === currentSlide
        );

      });


      dots.forEach((dot, i) => {

        dot.classList.toggle(
          "active",
          i === currentSlide
        );

      });

    }


    function changeSlide(direction) {

      currentSlide += direction;


      if (currentSlide >= slides.length) {

        currentSlide = 0;

      }


      if (currentSlide < 0) {

        currentSlide =
          slides.length - 1;

      }


      showSlide(currentSlide);

    }


    /* AUTO SLIDESHOW */

    setInterval(() => {

      changeSlide(1);

    }, 5000);


    /* LIGHTBOX */

    function openLightbox(src) {

      document
        .getElementById("lightbox-image")
        .src = src;

      document
        .getElementById("lightbox")
        .classList.add("active");

    }


    function closeLightbox() {

      document
        .getElementById("lightbox")
        .classList.remove("active");

    }

  </script>
