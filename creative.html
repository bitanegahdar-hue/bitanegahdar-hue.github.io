max-width:1500px;
margin:auto;

/* =========================
   PROJECT BOX
========================= */

.project{
aspect-ratio:1/1;
background:#0d0d0d;
border:1px solid #252525;
position:relative;
overflow:hidden;
cursor:pointer;
transition:.4s ease;
}

.project:hover{
border-color:#666;
transform:translateY(-4px);
}


/* =========================
   IMAGES
========================= */

.project img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.4s ease;
}

.project:hover img{
transform:scale(1.03);
}


/* =========================
   VIDEOS
========================= */

.project video{
width:100%;
height:100%;
object-fit:cover;
display:block;
background:#080808;
}


/* Video play indicator */

.video-project::after{
content:"▶";
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:48px;
height:48px;
border:1px solid rgba(255,255,255,.65);
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:17px;
color:#fff;
background:rgba(0,0,0,.35);
pointer-events:none;
transition:.3s ease;
}

.video-project:hover::after{
background:rgba(255,255,255,.15);
transform:translate(-50%,-50%) scale(1.08);
}


/* =========================
   LIGHTBOX
========================= */

.lightbox{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
align-items:center;
justify-content:center;
z-index:1000;
padding:30px;
}

.lightbox.active{
display:flex;
}

.lightbox img{
max-width:92vw;
max-height:88vh;
object-fit:contain;
}

.lightbox video{
max-width:92vw;
max-height:88vh;
width:auto;
height:auto;
object-fit:contain;
background:#000;
}

.close{
position:absolute;
top:20px;
right:35px;
color:#fff;
font-size:38px;
font-weight:300;
cursor:pointer;
z-index:1001;
line-height:1;
}

.close:hover{
color:#aaa;
}


/* =========================

========================= */

@media(max-width:500px){

grid-template-columns:1fr;
}

<script>


/* =========================
   IMAGE LIGHTBOX
========================= */

function openImage(src){

const lightbox =
document.getElementById("lightbox");

const image =
document.getElementById("lightbox-image");

const video =
document.getElementById("lightbox-video");


video.pause();

video.removeAttribute("src");

video.style.display="none";

image.src=src;

image.style.display="block";

lightbox.classList.add("active");

}


/* =========================
   VIDEO LIGHTBOX
========================= */

function openVideo(src){

const lightbox =
document.getElementById("lightbox");

const image =
document.getElementById("lightbox-image");

const video =
document.getElementById("lightbox-video");


image.style.display="none";

image.removeAttribute("src");

video.src=src;

video.style.display="block";

lightbox.classList.add("active");

video.play();

}


/* =========================
   CLOSE LIGHTBOX
========================= */

function closeLightbox(event){

if(
event.target.id==="lightbox" ||
event.target.classList.contains("close")
){

const lightbox =
document.getElementById("lightbox");

const video =
document.getElementById("lightbox-video");

video.pause();

video.removeAttribute("src");

lightbox.classList.remove("active");

}

}


/* =========================
   ESC KEY
========================= */

document.addEventListener("keydown",function(event){

if(event.key==="Escape"){

const lightbox =
document.getElementById("lightbox");

const video =
document.getElementById("lightbox-video");

video.pause();

video.removeAttribute("src");

lightbox.classList.remove("active");

}

});


</script>
